services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nomadplan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nomadplan
      POSTGRES_PASSWORD: nomadplan_dev
      POSTGRES_DB: nomadplan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: